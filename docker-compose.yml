name: lia

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lia
      POSTGRES_PASSWORD: lia
      POSTGRES_DB: lia
    volumes:
      - lia-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lia -d lia"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.4
    volumes:
      - lia-qdrant:/qdrant/storage

  api:
    build: ./apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lia:lia@postgres:5432/lia
      READONLY_DATABASE_URL: postgresql://lia_reader:lia_reader@postgres:5432/lia
      READONLY_PASSWORD: lia_reader
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
      TRACE_DIR: /traces
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DATA_OWNER_EMAIL: ${DATA_OWNER_EMAIL:-}
    volumes:
      - ./docs/tech - assignment:/data:ro
      - lia-traces:/traces
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s

  web:
    build: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8090:80"

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - lia-ollama:/root/.ollama

volumes:
  lia-pg:
  lia-qdrant:
  lia-traces:
  lia-ollama:
