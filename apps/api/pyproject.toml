[project]
name = "lia-api"
version = "0.1.0"
description = "LIA utilization assistant API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "psycopg[binary]>=3.2.0",
  "openpyxl>=3.1.5",
  "sqlglot>=26.0.0",
  "langgraph>=0.2.60",
  "qdrant-client>=1.12.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
